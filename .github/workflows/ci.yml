name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The site address comes from the repository, so this workflow works in any user's
      # <name>.github.io repository.
      - name: Set the site address
        run: echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # Writes the static site to out/.
      - run: npm run build
      # Lighthouse on every page; fails under 95 performance or 100 accessibility / best practices / SEO.
      - run: npx --yes @lhci/cli@0.16.1 autorun
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    # Publishes to GitHub Pages only from main, after every check has passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
